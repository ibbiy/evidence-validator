name: Build All Platforms

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller flask pillow reportlab PyPDF2 requests
      - run: pyinstaller evidence-validator.spec --clean
      - uses: actions/upload-artifact@v4
        with:
          name: EvidenceValidator-Windows
          path: dist/EvidenceValidator.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller flask pillow reportlab PyPDF2 requests
      - run: pyinstaller evidence-validator.spec --clean
      - uses: actions/upload-artifact@v4
        with:
          name: EvidenceValidator-Linux
          path: dist/EvidenceValidator

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller flask pillow reportlab PyPDF2 requests
      - run: pyinstaller evidence-validator.spec --clean
      - uses: actions/upload-artifact@v4
        with:
          name: EvidenceValidator-macOS
          path: dist/EvidenceValidator
